# Own rate-limiter buckets for the passkey self-service mutations. Each key here
# is turned into a RateLimiterFactory by the core RateLimiterCompilerPass and is
# addressable via RateLimiter::ensureAccepted('<key>', $cacheKey).
# Under APP_ENV=test the core wraps every factory in NoLimiter, so tests are unaffected.
shopware:
    api:
        rate_limiter:
            act_passkey_register:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    -   limit: 5
                        interval: '60 seconds'
                    -   limit: 10
                        interval: '300 seconds'
            act_passkey_delete:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    -   limit: 5
                        interval: '60 seconds'
                    -   limit: 10
                        interval: '300 seconds'
            # Caps how many challenge entries one client can write into the
            # challenge pool. Keyed by IP alone (the flow is usernameless), so
            # `fixed_window` over `time_backoff`: an escalating 24h lockout would
            # bar every legitimate user behind the same NAT.
            act_passkey_challenge:
                enabled: true
                policy: 'fixed_window'
                limit: 60
                interval: '60 seconds'
            # The customer login routes. Unlike the challenge bucket this one is
            # `time_backoff`, because the callers reset() it on a successful login:
            # only failures accumulate, so a shared NAT cannot lock itself out.
            act_passkey_login:
                enabled: true
                policy: 'time_backoff'
                reset: '24 hours'
                limits:
                    -   limit: 10
                        interval: '60 seconds'
                    -   limit: 20
                        interval: '300 seconds'
