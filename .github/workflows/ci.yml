name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Catches breakage from new Shopware releases and advisories without a code change.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  validate:
    name: Extension validate (${{ matrix.check-against }} supported Shopware)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check-against: [ lowest, highest ]
    steps:
      - uses: actions/checkout@v4

      # Deprecation notices differ between the lowest and the highest supported Shopware
      # release, so no code satisfies both; a local check still reports them.
      - name: Ignore deprecation notices
        run: |
          cat > .shopware-extension.yml <<'YAML'
          validation:
            ignore:
              - message: "deprecated"
              # AuthCodeRepository exists from Shopware 6.7.15 on and is injected optionally.
              - identifier: phpstan/class.notFound
                path: src/Session/SessionRevoker.php
          YAML

      - name: shopware-cli extension validate
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check
          check-against: ${{ matrix.check-against }}

  tests:
    name: PHPStan & PHPUnit (Shopware 6.7.16.0)
    runs-on: ubuntu-latest
    env:
      # tests/bootstrap.php falls back to a local development DSN when this is unset.
      TEST_DATABASE_URL: mysql://root@127.0.0.1/test_passkey
    steps:
      # Checks out Shopware to the workspace root and this repository to
      # custom/plugins/ActPasskey, then installs its composer requirements.
      - name: Set up Shopware
        uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ActPasskey
          shopwareVersion: v6.7.16.0
          phpVersion: '8.4'
          # Advisories on Shopware's own dependencies would block this throwaway test install.
          allow-insecure-versions: 'true'

      # The checkout's extension installer would load every installed PHPStan extension;
      # this plugin's standard is its own config plus phpstan-strict-rules only.
      - name: PHPStan
        run: |
          rm -rf vendor/phpstan/extension-installer
          composer dump-autoload --no-scripts --quiet
          printf 'includes:\n    - custom/plugins/ActPasskey/phpstan.neon.dist\n    - vendor/phpstan/phpstan-strict-rules/rules.neon\n' > phpstan-strict.neon
          vendor/bin/phpstan analyse -c phpstan-strict.neon --no-progress --memory-limit=1G --error-format=github

      # Same call and timezone as the development setup; tests derive expected
      # values from date.timezone.
      - name: PHPUnit
        run: vendor/bin/phpunit -d date.timezone=Europe/Berlin -c custom/plugins/ActPasskey/phpunit.xml.dist
