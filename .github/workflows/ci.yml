name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Extension validate (lowest supported Shopware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deprecation notices differ between the lowest and the highest supported Shopware
      # release, so no code satisfies both; a local check against the highest still reports them.
      - name: Ignore deprecation notices
        run: |
          cat > .shopware-extension.yml <<'YAML'
          validation:
            ignore:
              - message: "deprecated"
              # AuthCodeRepository exists from Shopware 6.7.15 on and is injected optionally.
              - identifier: phpstan/class.notFound
                path: src/Session/SessionRevoker.php
          YAML

      - name: shopware-cli extension validate
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check
          check-against: lowest

  tests:
    name: PHPStan & PHPUnit (Shopware 6.7.16.0)
    runs-on: ubuntu-latest
    env:
      # tests/bootstrap.php falls back to a local development DSN when this is unset.
      TEST_DATABASE_URL: mysql://root@127.0.0.1/test_passkey
    steps:
      # Checks out Shopware to the workspace root and this repository to
      # custom/plugins/ActPasskey, then installs its composer requirements.
      - name: Set up Shopware
        uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ActPasskey
          shopwareVersion: v6.7.16.0
          phpVersion: '8.4'

      - name: PHPStan
        uses: shopware/github-actions/phpstan@main
        with:
          extensionName: ActPasskey

      - name: PHPUnit
        uses: shopware/github-actions/phpunit@main
        with:
          extensionName: ActPasskey
          filterName: ActPasskey
