name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Extension validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shopware-cli extension validate --full
        uses: shopware/github-actions/extension-verifier@main
        with:
          action: check

  tests:
    name: PHPStan & PHPUnit
    runs-on: ubuntu-latest
    env:
      # tests/bootstrap.php falls back to a local development DSN when this is unset.
      TEST_DATABASE_URL: mysql://root@127.0.0.1/test_passkey
    steps:
      # Checks out Shopware to the workspace root and this repository to
      # custom/plugins/ActPasskey, then installs the plugin's composer
      # requirements into the root vendor. No separate checkout step needed.
      - name: Set up Shopware
        uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ActPasskey
          # Pinned patch must stay recent enough that composer's advisory policy
          # does not block Shopware's own dependencies.
          shopwareVersion: v6.7.12.2
          phpVersion: '8.4'

      - name: PHPStan
        uses: shopware/github-actions/phpstan@main
        with:
          extensionName: ActPasskey

      - name: PHPUnit
        uses: shopware/github-actions/phpunit@main
        with:
          extensionName: ActPasskey
          filterName: ActPasskey
